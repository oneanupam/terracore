# This workflow runs checks on pull requests to ensure code quality and security standards are met before merging into the master branch.
name: PR Checks Workflow

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  pull-request-checks:
    name: Pull Request Checks Job
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code
      - name: Code checkout
        id: code_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Check PR title prefix to ensure it follows the convention
      - name: Check PR title prefix
        run: |
          echo "PR Title: '${{ github.event.pull_request.title }}'"

          if [[ ! "${{ github.event.pull_request.title }}" =~ ^(ci|feat|fix|chore|docs|refactor): ]]; then
            echo "❌ PR title must start with one of: ci:, feat:, fix:, chore:, docs:, refactor:"
            exit 1
          else
            echo "✅ PR title is valid."
          fi
